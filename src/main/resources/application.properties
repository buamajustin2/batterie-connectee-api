# CONFIGURATION SERVEUR (Render gère le HTTPS)
server.port=${PORT:9095}
server.ssl.enabled=false
#server.ssl.key-store=classpath:ssl/keystore.p12
#server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD:password}
#server.ssl.key-store-type=PKCS12
#server.ssl.key-alias=baeldung
#server.ssl.key-password=${SSL_KEY_PASSWORD:password}

# CONFIGURATION BASE DE DONNÉES (Valeurs locales par défaut)
spring.application.name=batterie-connectee-api
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3308/batterie?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:dbuser_mysql}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:motdepasse}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA — Flyway gère le schéma, Hibernate VALIDE seulement
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# SWAGGER
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# FLYWAY
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.table=flyway_schema_history